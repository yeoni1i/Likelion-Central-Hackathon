name: Build Android APK

on:
  # Actions 탭에서 [Run workflow] 버튼으로 수동 실행 (서버 주소 입력 가능)
  workflow_dispatch:
    inputs:
      base_url:
        description: "앱이 접속할 서버 주소 (끝에 / 필수, 예: https://xxxx.trycloudflare.com/). 비워두면 각 앱의 기본 주소 사용"
        required: false
  # PR을 올리면 빌드가 깨지지 않는지 자동 확인
  pull_request:
    paths:
      - "app/**"
      - "mobile/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.inputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mobile app (보호자 앱)
        working-directory: mobile/AtoCueMobile
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug ${BASE_URL:+-PATOCUE_BASE_URL="$BASE_URL"}

      - name: Build watch app (워치 앱)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug ${BASE_URL:+-PATOCUE_BASE_URL="$BASE_URL"}

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: AtoCue-mobile-debug
          path: mobile/AtoCueMobile/app/build/outputs/apk/debug/*.apk

      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: AtoCue-watch-debug
          path: app/build/outputs/apk/debug/*.apk
